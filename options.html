<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Follow-up Local — settings</title><link rel="stylesheet" href="options.css"></head>
<body><main>
<h1>Follow-up Local — settings</h1>
<p>Default time for +1, +3, +7 and +21 day presets, whether a follow-up is created from a message or the compose window.</p>
<label for="defaultTime">Default reminder time</label>
<div class="row"><input id="defaultTime" type="time" value="08:15"><button id="save" type="button">Save</button></div>
<p class="note">Custom dates can have their own time. Changing this setting does not affect existing follow-ups.</p>
<p id="status" role="status" aria-live="polite"></p>
</main><script src="options.js"></script></body></html>
